name: Kroeg en Karaf dagelijkse publicatie
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publiceer naar de bestaande Cloudflare-site'
        type: boolean
        default: false
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
concurrency:
  group: kroegenkaraf-publicatie
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_DAILY_PUBLICATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Werkmap voorbereiden
        run: python scripts/prepare_build.py
      - name: Drive downloaden
        working-directory: .publication
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_CSV_FILE_ID: ${{ vars.DRIVE_CSV_FILE_ID }}
          DRIVE_PHOTOS_FOLDER_ID: '1Uh0EFidJfV8uBd4H_YXLJ3XhluKCKTEb'
        run: |
          set -o pipefail
          python ../scripts/download_drive.py 2>&1 | tee download.log
      - name: Bouwen en controleren
        working-directory: .publication
        run: |
          set -o pipefail
          python ../scripts/publiceer.py 2>&1 | tee build.log
          python ../scripts/check_build.py 2>&1 | tee checks.log
      - name: Proefsite bewaren
        uses: actions/upload-artifact@v4
        with:
          name: kroegenkaraf-proefsite
          path: .publication/site/
          retention-days: 7
          if-no-files-found: error
      - name: Publiceren
        if: success() && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'schedule' && vars.ENABLE_DAILY_PUBLICATION == 'true'))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CI: '1'
        run: npx --yes wrangler@4 deploy
      - name: Verslag
        if: always()
        shell: bash
        run: |
          for report in .publication/download.log .publication/build.log .publication/checks.log; do
            if [ -f "$report" ]; then
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Logbestanden bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kroegenkaraf-verslag
          path: .publication/*.log
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
